# Local development convenience file (this covers the "docker.yml" item in
# the requested project layout - Docker's actual convention is
# docker-compose.yml, used alongside the Dockerfile).
#
# Usage:
#   docker compose up --build

version: "3.9"

services:
  trip-planner:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./knowledge:/app/knowledge
      - ./data:/app/data
      - ./logs:/app/logs
